baseURL = 'https://www.olycanlan.org/'
locale = 'en-us'
title = '🍁Olympia Canadian Highlander League🍁'
theme = 'ananke'

[markup]
    [markup.goldmark]
        [markup.goldmark.renderer]
            unsafe = true

# Pages under content/pages/*.md are served at clean root URLs
# (e.g. content/pages/standings.md -> /standings/) to match the menu above.
[permalinks]
    pages = "/:contentbasename/"

# Site-wide description used for meta tags
[params]
    description = "Home of the Olympia Canadian Highlander League (OlyCanLan) — season standings, player records, decklists, and everything you need to battle."
    mainSections = ["posts"]

    [params.ananke]
        custom_css = ["custom.css"]

        [params.ananke.home]
            content_alignment = "left"
            show_recent_posts = false

[menu]
    [[menu.main]]
        identifier = "home"
        name = "Home"
        url = "/"
        weight = 1
    [[menu.main]]
        identifier = "standings"
        name = "Standings"
        url = "/standings/"
        weight = 3
    [[menu.main]]
        identifier = "records"
        name = "Player Records"
        url = "/records/"
        weight = 4
    [[menu.main]]
        identifier = "commands"
        name = "Bot Commands"
        url = "/commands/"
        weight = 5

